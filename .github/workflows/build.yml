name: Build Wii U Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_plugin:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wiiu-env/devkitppc:latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Fetch and Install WUPS Framework
        run: |
          git clone https://github.com/wiiu-env/WiiUPluginSystem.git
          cd WiiUPluginSystem
          PATH=/opt/devkitpro/devkitPPC/bin:$PATH DEVKITPRO=/opt/devkitpro make install

      - name: Compile Plugin via Makefile
        run: |
          # Added the temporary compiled tool location straight into the system PATH
          export PATH="$PWD/WiiUPluginSystem/wups-elf2wps:$PATH"
          export PATH="/opt/devkitpro/devkitPPC/bin:$PATH"
          export DEVKITPRO="/opt/devkitpro"
          
          make clean
          make

      - name: Upload Finished Compiled WPS Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickResolution-Plugin
          path: ./*.wps
