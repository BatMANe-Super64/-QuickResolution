name: Build Wii U Aroma Plugin

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WUPS plugin
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wiiu-env/devkitppc:latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build plugin
        run: |
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITPPC="${DEVKITPPC:-$DEVKITPRO/devkitPPC}"
          make clean
          make
          test -s QuickResolution.wps

      - name: Upload WPS artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickResolution-Plugin
          path: QuickResolution.wps
          if-no-files-found: error
          compression-level: 0
