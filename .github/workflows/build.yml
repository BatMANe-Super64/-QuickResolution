name: Build Wii U Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_plugin:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wiiu-env/devkitppc:latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Fetch and Install WUPS Framework Locally
        run: |
          git clone https://github.com/wiiu-env/WiiUPluginSystem.git
          cd WiiUPluginSystem
          export PATH="/opt/devkitpro/devkitPPC/bin:$PATH"
          export DEVKITPRO="/opt/devkitpro"
          make install
          
          # Force compile the host packaging tool natively inside its source folder
          cd wups-elf2wps
          make
          # Copy the finished utility binary straight into the main workspace root
          cp wups-elf2wps ../../

      - name: Compile Plugin via Makefile
        run: |
          # Add the main workspace root directory explicitly into the active PATH search
          export PATH="$PWD:/opt/devkitpro/devkitPPC/bin:$PATH"
          export DEVKITPRO="/opt/devkitpro"
          make clean
          make

      - name: Upload Finished Compiled WPS Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickResolution-Plugin
          path: ./*.wps
