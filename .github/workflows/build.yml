name: Build Wii U Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_plugin:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wiiu-env/devkitppc:latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Fetch and Compile WUPS Toolchain Natively
        run: |
          git clone https://github.com/wiiu-env/WiiUPluginSystem.git
          cd WiiUPluginSystem/wups-elf2wps
          make

      - name: Compile Plugin via Makefile
        run: |
          export PATH="/opt/devkitpro/devkitPPC/bin:$PATH"
          export DEVKITPRO="/opt/devkitpro"
          make clean
          make QuickResolution.elf

      - name: Package ELF into WPS Plugin Binary
        run: |
          ./WiiUPluginSystem/wups-elf2wps/wups-elf2wps QuickResolution.elf --output QuickResolution.wps

      - name: Upload Finished Compiled WPS Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickResolution-Plugin
          path: ./*.wps
